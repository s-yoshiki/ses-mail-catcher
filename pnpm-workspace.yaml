# Workspace definition for the pnpm + Turborepo monorepo.

packages:
  - configs/*
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - aws-cdk-lib@2.268.0
  - projen@0.103.16
  - vitest@5.0.0

catalog:
  '@types/node': '^26.6.6'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^6.3.0'
  'aws-cdk-lib': '2.277.0'
  'commit-and-tag-version': '^13.3.0'
  'constructs': '10.8.1'
  'jsii': '~6.0.22'
  'jsii-diff': '^1.142.0'
  'jsii-docgen': '^10.12.9'
  'jsii-pacmak': '^1.142.0'
  'jsii-rosetta': '~6.0.24'
  'msw': '^2.11.8'
  'oxfmt': '0.78.0'
  'oxlint': '1.93.0'
  'turbo': '2.11.11'
  'postal-mime': '^3.0.0'
  'projen': '^0.104.31'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'tsx': '^4.23.15'
  'typescript': '~7.0.2'
  'vite': '^8.3.8'
  'vitest': '^5.1.0'
  'zod': '^4.6.7'
