# Workspace definition for the pnpm + Turborepo monorepo.

packages:
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - "@parcel/watcher"
  - unrs-resolver
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - aws-cdk-lib@2.268.0
  - projen@0.103.16
  - vitest@5.0.0
